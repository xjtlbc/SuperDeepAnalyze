map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Gzip compression for better performance on slow networks
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               text/xml application/xml image/svg+xml font/woff2
               application/wasm;
    gzip_min_length 256;
    gzip_vary on;
    gzip_comp_level 6;

    # Allow large file uploads
    client_max_body_size 100M;

    # ---- Frontend SPA ----
    location / {
        root /app/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Static assets with long cache
    location /assets/ {
        root /app/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- API reverse proxy (handles both HTTP and WebSocket) ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-running compilation and WebSocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
    }

    # ---- WebSocket: general ----
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
}
