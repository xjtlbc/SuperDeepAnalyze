[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "superdeepanalyze"
version = "0.1.0"
description = "公检法卷宗深度分析系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "openai>=1.55.0",
    "faiss-cpu>=1.9.0",
    "docling>=2.15.0",
    "python-docx>=1.1.0",
    "python-calamine>=0.4.0",
    "pymupdf>=1.24.0",
    "tiktoken>=0.8.0",
    "Pillow>=11.0.0",
    "networkx>=3.0",
    "python-louvain>=0.16",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
